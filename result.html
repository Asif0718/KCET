<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Result · KCET MCQ</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ============ Navbar ============ -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="brand">
        <span class="logo">🎯</span>
        KCET Practice
      </a>
      <div class="nav-actions">
        <button id="themeToggle" class="icon-btn" title="Toggle dark mode">
          <span class="icon-sun">☀️</span>
          <span class="icon-moon">🌙</span>
        </button>
      </div>
    </div>
  </nav>

  <div class="container">
    <!-- ============ Result card ============ -->
    <div class="result-card">
      <h2 id="resultSubject">Practice Result</h2>
      <p class="sub">Here is your performance summary</p>

      <!-- Circular score ring -->
      <div id="scoreRing" class="result-score" style="--score: 0">
        <span class="score-value" id="scoreValue">0%</span>
      </div>

      <div class="result-stats">
        <div class="stat total">
          <div class="stat-value" id="statTotal">0</div>
          <div class="stat-label">Total</div>
        </div>
        <div class="stat correct">
          <div class="stat-value" id="statCorrect">0</div>
          <div class="stat-label">Correct</div>
        </div>
        <div class="stat wrong">
          <div class="stat-value" id="statWrong">0</div>
          <div class="stat-label">Wrong</div>
        </div>
        <div class="stat skipped">
          <div class="stat-value" id="statSkipped">0</div>
          <div class="stat-label">Skipped</div>
        </div>
      </div>

      <div id="chapterBreakdown" class="chapter-breakdown hidden"></div>

      <div class="result-actions">
        <button id="restartBtn" class="btn btn-primary">🔄 Restart Practice</button>
        <button id="reviewBtn" class="btn btn-outline">📖 Review Questions</button>
        <a id="historyBtn" href="history.html" class="btn btn-outline hidden">📊 History</a>
        <a href="index.html" class="btn btn-ghost">🏠 Home</a>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="data/embedded.js"></script>
  <script src="js/history-ui.js"></script>
  <script>
    /* ============================================================
       Result page logic
       Reads the saved summary from LocalStorage (computed in
       quiz.js) and renders it with an animated score ring.
       ============================================================ */
    document.addEventListener("DOMContentLoaded", async () => {
      const user = await Auth.requireAuth();
      Auth.renderNav(user);
      if (user) document.getElementById("historyBtn").classList.remove("hidden");

      const subject = new URLSearchParams(window.location.search).get("subject") || "chemistry";
      const result = Storage.getResult(subject);

      const meta = quizMeta(subject);
      if (meta) document.getElementById("resultSubject").textContent = `${meta.name} Result`;

      if (!result) {
        document.getElementById("scoreValue").textContent = "—";
        document.getElementById("scoreRing").style.setProperty("--score", 0);
        document.querySelector(".result-card .sub").textContent =
          "No attempt found for this subject yet.";
      } else {
        const { total, correct, wrong, percentage } = result;
        const skipped = result.skipped ?? 0;
        document.getElementById("statTotal").textContent = total;
        document.getElementById("statCorrect").textContent = correct;
        document.getElementById("statWrong").textContent = wrong;
        document.getElementById("statSkipped").textContent = skipped;
        document.getElementById("scoreValue").textContent = percentage + "%";
        document.getElementById("scoreRing").style.setProperty("--score", percentage);

        const attemptedChapters = Object.fromEntries(
          Object.entries(result.chapter_stats || {}).filter(([, s]) => s.attempted > 0)
        );
        if (Object.keys(attemptedChapters).length > 0) {
          const box = document.getElementById("chapterBreakdown");
          box.innerHTML = "<h3>Chapter breakdown</h3>" + HistoryUI.chapterTable(attemptedChapters);
          box.classList.remove("hidden");
        }
      }

      /* Restart: clear saved session and go back to practice */
      document.getElementById("restartBtn").addEventListener("click", () => {
        Storage.resetSession(subject);
        goTo(`practice.html?subject=${subject}`);
      });

      /* Review: jump back to the practice page without clearing */
      document.getElementById("reviewBtn").addEventListener("click", () => {
        goTo(`practice.html?subject=${subject}`);
      });
    });
  </script>
</body>
</html>
