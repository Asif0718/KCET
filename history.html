<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>History · KCET MCQ</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ============ Navbar ============ -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="brand">
        <span class="logo">🎯</span>
        KCET Practice
      </a>
      <div class="nav-actions">
        <button id="themeToggle" class="icon-btn" title="Toggle dark mode">
          <span class="icon-sun">☀️</span>
          <span class="icon-moon">🌙</span>
        </button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="practice-header">
      <div>
        <h2>📊 Score History</h2>
        <div class="sub">Your attempts, grouped by subject and chapter</div>
      </div>
      <div class="controls history-filter">
        <label for="subjectFilter">Subject</label>
        <select id="subjectFilter"><option value="all">All subjects</option></select>
      </div>
    </div>

    <div id="historyEmpty" class="empty-state">
      <div class="big">⏳</div>
      <p>Loading your history…</p>
    </div>

    <div id="historyContent" class="hidden">
      <h3 class="history-heading">Overview</h3>
      <div id="summaryGrid" class="summary-grid"></div>

      <h3 class="history-heading">All attempts</h3>
      <div id="attemptList" class="attempt-list"></div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/history-ui.js"></script>
  <script>
    /* ============================================================
       History page logic
       Loads the user's attempts from Supabase and renders a
       per-quiz overview (best / average / weakest chapter) and a
       full attempt list with chapter breakdowns.
       ============================================================ */
    document.addEventListener("DOMContentLoaded", async () => {
      const empty = document.getElementById("historyEmpty");
      const content = document.getElementById("historyContent");
      const filter = document.getElementById("subjectFilter");
      const H = HistoryUI;

      function showEmpty(icon, message) {
        content.classList.add("hidden");
        empty.classList.remove("hidden");
        empty.querySelector(".big").textContent = icon;
        empty.querySelector("p").textContent = message;
      }

      if (!Auth.enabled) {
        showEmpty("🔒", "History needs Supabase. Fill in js/supabase-config.js to enable login and score history.");
        return;
      }

      Auth.renderNav(await Auth.requireAuth());

      let attempts;
      try {
        attempts = await Auth.getAttempts();
      } catch (err) {
        showEmpty("⚠️", `Could not load history: ${err.message}`);
        return;
      }

      const nameOf = (key) => (quizMeta(key) || { name: key }).name;

      const subjects = [...new Set(attempts.map((a) => a.subject))];
      filter.innerHTML += subjects
        .map((s) => `<option value="${H.escape(s)}">${H.escape((subjectMeta(s) || { name: s }).name)}</option>`)
        .join("");
      filter.addEventListener("change", render);

      function render() {
        const list = filter.value === "all" ? attempts : attempts.filter((a) => a.subject === filter.value);
        if (list.length === 0) {
          showEmpty("📭", "No attempts yet. Finish a practice session to see it here.");
          return;
        }
        empty.classList.add("hidden");
        content.classList.remove("hidden");
        renderSummary(list);
        renderAttempts(list);
      }

      function renderSummary(list) {
        const groups = {};
        list.forEach((a) => (groups[a.quiz_key] ||= []).push(a));

        document.getElementById("summaryGrid").innerHTML = Object.entries(groups)
          .map(([key, items]) => {
            const scores = items.map((a) => a.percentage);
            const best = Math.max(...scores);
            const avg = Math.round(scores.reduce((s, x) => s + x, 0) / scores.length);
            const latest = items[0].percentage;

            const chapters = {};
            items.forEach((a) =>
              Object.entries(a.chapter_stats || {}).forEach(([ch, s]) => {
                const c = (chapters[ch] ||= { attempted: 0, correct: 0 });
                c.attempted += s.attempted;
                c.correct += s.correct;
              })
            );
            const weakest = Object.entries(chapters)
              .filter(([, s]) => s.attempted > 0)
              .map(([ch, s]) => ({ ch, acc: H.pct(s.correct, s.attempted) }))
              .sort((a, b) => a.acc - b.acc)[0];

            const meta = quizMeta(key);
            const style = meta ? `--card-color:${meta.color};--card-color-2:${meta.color2}` : "";
            return `
              <div class="summary-card" style="${style}">
                <h4>${meta ? meta.icon + " " : ""}${H.escape(nameOf(key))}</h4>
                <div class="summary-stats">
                  <div><strong>${items.length}</strong><span>Attempts</span></div>
                  <div><strong>${best}%</strong><span>Best</span></div>
                  <div><strong>${avg}%</strong><span>Average</span></div>
                  <div><strong>${latest}%</strong><span>Latest</span></div>
                </div>
                ${
                  weakest && Object.keys(chapters).length > 1
                    ? `<p class="weakest">Weakest: <b>${H.escape(weakest.ch)}</b> (${weakest.acc}%)</p>`
                    : ""
                }
              </div>`;
          })
          .join("");
      }

      function renderAttempts(list) {
        document.getElementById("attemptList").innerHTML = list
          .map(
            (a) => `
              <details class="attempt">
                <summary>
                  <span class="attempt-name">${H.escape(nameOf(a.quiz_key))}</span>
                  <span class="attempt-date">${H.formatDate(a.created_at)}</span>
                  <span class="attempt-counts">✅ ${a.correct} · ❌ ${a.wrong} · ⏭ ${a.skipped}</span>
                  <span class="acc ${H.accClass(a.percentage)}">${a.percentage}%</span>
                </summary>
                ${H.chapterTable(a.chapter_stats || {})}
              </details>`
          )
          .join("");
      }

      render();
    });
  </script>
</body>
</html>
